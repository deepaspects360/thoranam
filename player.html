<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thoranam walkthrough</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600&family=Noto+Sans+Tamil:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root { --size: 40px; --bg: .72; --font: "Noto Sans", "Noto Sans Tamil", "Latha", "Nirmala UI", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #14060b; color: #fdefd6; font-family: var(--font); }
  main { max-width: 1280px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; font-weight: 600; margin: 4px 0 12px; }
  .stage { position: relative; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; overflow: hidden; }
  video { display: block; width: 100%; height: 100%; }
  .subs { position: absolute; left: 4%; right: 4%; bottom: 9%; display: grid; gap: .25em; justify-items: center; pointer-events: none; text-align: center; }
  .subs.top { bottom: auto; top: 5%; }
  .subs span { font-size: var(--size); line-height: 1.3; padding: .12em .5em; border-radius: .25em; background: rgba(0,0,0,var(--bg)); color: #fff; white-space: pre-line; text-shadow: 0 1px 2px #000; }
  .subs span.ta { color: #ffe3a6; }
  :fullscreen .subs span { font-size: calc(var(--size) * 1.4); }
  .bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-top: 12px; font-size: 15px; }
  .bar label { display: flex; align-items: center; gap: 8px; }
  select, button, input[type=range] { font: inherit; }
  select, button { background: #2a0814; color: #fdefd6; border: 1px solid #7a1f3d; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
  button:hover, select:hover { border-color: #f2a33a; }
  input[type=range] { width: 180px; accent-color: #f2a33a; }
  .hint { opacity: .7; font-size: 13px; }
</style>
</head>
<body>
<main>
  <h1>Thoranam: product walkthrough</h1>
  <div class="stage" id="stage">
    <video id="v" src="Walkthrough_Full.mp4" controls playsinline preload="metadata"></video>
    <div class="subs" id="subs" aria-live="polite"></div>
  </div>
  <div class="bar">
    <label>Subtitles
      <select id="lang">
        <option value="en">English</option>
        <option value="ta">தமிழ் (Tamil)</option>
        <option value="both">English + தமிழ்</option>
        <option value="off">Off</option>
      </select>
    </label>
    <label>Size <input id="size" type="range" min="16" max="96" step="2"> <output id="sizeOut"></output></label>
    <label>Background <input id="bg" type="range" min="0" max="1" step="0.05"></label>
    <label>Position
      <select id="pos"><option value="bottom">Bottom</option><option value="top">Top</option></select>
    </label>
    <button id="fs" type="button">Full screen</button>
    <span class="hint">Keys: + / − change the subtitle size, S switches language.</span>
  </div>
</main>
<script>
  const CUES = {"en": [[0.3, 3.8, "Thoranam: product walkthrough\nTemplates · Builder · Publish · Guests · Offline"], [4.61, 13.12, "Thoranam: multilingual invitations for Indian celebrations."], [13.12, 22.12, "Eight languages, live preview, guest RSVP, and it works offline."], [25.24, 34.24, "Filter templates by event, tradition, style, language and price."], [36.27, 45.27, "Premium shows the signature designs, rebuilt from hand-made wedding sites."], [50.27, 59.27, "Golden Chapel opens with an envelope video. Tap to open."], [62.46, 71.46, "Then the hero video, names and a live countdown."], [73.85, 82.85, "Events with maps and calendar links, family details, and RSVP."], [98.99, 107.99, "Moonlight Nikkah: a night-sky look with its own opening."], [124.74, 133.74, "Sign in with the demo account. All data here is synthetic."], [138.33, 147.33, "New invitation: pick the event, then the tradition."], [149.86, 158.86, "Smart Generate designs everything from a few details."], [161.8, 169.57, "Names, date and venue. Tamil is added as a second language."], [169.57, 176.74, "The builder: editing on the left, live preview on the right."], [176.74, 185.74, "Switch the design to the Golden Chapel signature template."], [190.74, 199.74, "Preview on a phone, tablet or desktop frame."], [209.52, 218.52, "Effects: motion style, particles, and auto-scroll controls."], [220.24, 226.88, "Languages: choose which languages guests can switch between."], [226.88, 230.22, "Content: every line is editable, and saving is automatic."], [230.22, 236.78, "Publish. The demo invitation is on the Premium plan."], [236.78, 245.78, "Share the link on WhatsApp, or copy it."], [247.48, 256.48, "What a guest sees: the opening, then the invitation."], [260.84, 269.84, "Guests switch the language in place, here to Tamil."], [277.07, 286.07, "A guest replies. Without a connection, the reply is queued and sent later."], [295.24, 304.18, "The host sees every reply, with counts and personal guest links."], [305.3, 314.3, "On a phone: the invitation and the app fit a 390-pixel screen."], [332.41, 340.16, "First visit: the invitation and its videos are saved for offline use."], [340.16, 349.16, "Network off. The invitation reloads from the offline cache."], [352.47, 359.5, "Installable as an app, and it keeps working offline."], [360.3, 363.8, "Thank you for watching"]], "ta": [[0.3, 3.8, "தோரணம்: செயல்முறை விளக்கம்\nவார்ப்புருக்கள் · வடிவமைப்பு · வெளியீடு · விருந்தினர் · ஆஃப்லைன்"], [4.61, 13.12, "தோரணம்: இந்தியக் கொண்டாட்டங்களுக்கான பன்மொழி அழைப்பிதழ்கள்."], [13.12, 22.12, "எட்டு மொழிகள், நேரடி முன்னோட்டம், விருந்தினர் பதில், இணையமின்றியும் இயங்கும்."], [25.24, 34.24, "நிகழ்வு, மரபு, பாணி, மொழி, விலை வாரியாக வடிவமைப்புகளைத் தேடலாம்."], [36.27, 45.27, "பிரீமியம் பிரிவில், கையால் உருவான திருமணத் தளங்களின் சிறப்பு வடிவமைப்புகள்."], [50.27, 59.27, "கோல்டன் சேப்பல் ஒரு உறை வீடியோவுடன் திறக்கிறது. திறக்கத் தொடவும்."], [62.46, 71.46, "அடுத்து முகப்பு வீடியோ, பெயர்கள், நேரடி கவுண்ட்டவுன்."], [73.85, 82.85, "வரைபடம், நாட்காட்டி இணைப்புகளுடன் நிகழ்வுகள், குடும்ப விவரங்கள், வருகை உறுதி."], [98.99, 107.99, "மூன்லைட் நிக்காஹ்: இரவு வான அழகு, தனக்கே உரிய திறப்புடன்."], [124.74, 133.74, "டெமோ கணக்கில் உள்நுழைகிறோம். இங்குள்ள தரவு அனைத்தும் மாதிரித் தரவு."], [138.33, 147.33, "புதிய அழைப்பிதழ்: நிகழ்வைத் தேர்ந்தெடுத்து, பின் மரபைத் தேர்ந்தெடுக்கவும்."], [149.86, 158.86, "சில விவரங்களைக் கொண்டே ஸ்மார்ட் ஜெனரேட் முழு வடிவமைப்பையும் உருவாக்கும்."], [161.8, 169.57, "பெயர்கள், தேதி, இடம். இரண்டாம் மொழியாகத் தமிழ் சேர்க்கப்படுகிறது."], [169.57, 176.74, "வடிவமைப்புக் கருவி: இடப்புறம் திருத்தம், வலப்புறம் நேரடி முன்னோட்டம்."], [176.74, 185.74, "வடிவமைப்பைக் கோல்டன் சேப்பல் சிறப்பு வார்ப்புருவாக மாற்றுகிறோம்."], [190.74, 199.74, "கைபேசி, டேப்லெட், கணினி சட்டகங்களில் முன்னோட்டம் பார்க்கலாம்."], [209.52, 218.52, "விளைவுகள்: அசைவு பாணி, துகள்கள், தானியங்கி உருட்டல் கட்டுப்பாடுகள்."], [220.24, 226.88, "மொழிகள்: விருந்தினர்கள் மாற்றிப் பார்க்கக்கூடிய மொழிகளைத் தேர்வுசெய்யவும்."], [226.88, 230.22, "உள்ளடக்கம்: ஒவ்வொரு வரியையும் திருத்தலாம், சேமிப்பு தானாக நடக்கும்."], [230.22, 236.78, "வெளியிடுகிறோம். இந்த டெமோ அழைப்பிதழ் பிரீமியம் திட்டத்தில் உள்ளது."], [236.78, 245.78, "இணைப்பை வாட்ஸ்அப்பில் பகிரலாம், அல்லது நகலெடுக்கலாம்."], [247.48, 256.48, "விருந்தினர் பார்ப்பது: முதலில் திறப்பு, பின் அழைப்பிதழ்."], [260.84, 269.84, "விருந்தினர்கள் அதே இடத்தில் மொழியை மாற்றலாம், இங்கே தமிழுக்கு."], [277.07, 286.07, "ஒரு விருந்தினர் பதிலளிக்கிறார். இணையம் இல்லையெனில், பதில் சேமிக்கப்பட்டுப் பின்னர் அனுப்பப்படும்."], [295.24, 304.18, "ஒவ்வொரு பதிலையும், எண்ணிக்கையையும், தனிப்பட்ட இணைப்புகளையும் ஏற்பாட்டாளர் பார்க்கலாம்."], [305.3, 314.3, "கைபேசியில்: அழைப்பிதழும் செயலியும் 390 பிக்சல் திரைக்குள் பொருந்துகின்றன."], [332.41, 340.16, "முதல் வருகையிலேயே அழைப்பிதழும் அதன் வீடியோக்களும் ஆஃப்லைன் பயன்பாட்டிற்குச் சேமிக்கப்படுகின்றன."], [340.16, 349.16, "இணையம் துண்டிக்கப்பட்டது. அழைப்பிதழ் ஆஃப்லைன் சேமிப்பிலிருந்து மீண்டும் ஏற்றப்படுகிறது."], [352.47, 359.5, "செயலியாக நிறுவலாம், இணையமின்றியும் தொடர்ந்து இயங்கும்."], [360.3, 363.8, "பார்த்தமைக்கு நன்றி"]]};
  const $ = (id) => document.getElementById(id);
  const v = $("v"), subs = $("subs"), root = document.documentElement.style;
  const store = { get(k, d) { try { const x = localStorage.getItem("wt-" + k); return x === null ? d : x; } catch { return d; } },
                  set(k, x) { try { localStorage.setItem("wt-" + k, x); } catch {} } };
  const state = { lang: store.get("lang", "en"), size: +store.get("size", 40), bg: +store.get("bg", 0.72), pos: store.get("pos", "bottom") };
  function apply() {
    $("lang").value = state.lang; $("size").value = state.size; $("sizeOut").textContent = state.size + "px"; $("bg").value = state.bg; $("pos").value = state.pos;
    root.setProperty("--size", state.size + "px"); root.setProperty("--bg", state.bg);
    subs.classList.toggle("top", state.pos === "top");
    for (const k in state) store.set(k, state[k]);
    render(true);
  }
  let last = "";
  function active(lang, t) { const c = CUES[lang].find((c) => t >= c[0] && t < c[1]); return c ? c[2] : ""; }
  function render(force) {
    const t = v.currentTime, langs = state.lang === "both" ? ["en", "ta"] : state.lang === "off" ? [] : [state.lang];
    const lines = langs.map((l) => [l, active(l, t)]).filter((x) => x[1]);
    const key = JSON.stringify(lines);
    if (key === last && !force) return; last = key;
    subs.replaceChildren(...lines.map(([l, txt]) => { const s = document.createElement("span"); s.lang = l; s.className = l; s.textContent = txt; return s; }));
  }
  (function loop() { render(); requestAnimationFrame(loop); })();
  $("lang").onchange = (e) => { state.lang = e.target.value; apply(); };
  $("size").oninput = (e) => { state.size = +e.target.value; apply(); };
  $("bg").oninput = (e) => { state.bg = +e.target.value; apply(); };
  $("pos").onchange = (e) => { state.pos = e.target.value; apply(); };
  $("fs").onclick = () => $("stage").requestFullscreen?.();
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "SELECT") return;
    if (e.key === "+" || e.key === "=") { state.size = Math.min(96, state.size + 4); apply(); }
    else if (e.key === "-" || e.key === "_") { state.size = Math.max(16, state.size - 4); apply(); }
    else if (e.key.toLowerCase() === "s") { const o = ["en", "ta", "both", "off"]; state.lang = o[(o.indexOf(state.lang) + 1) % o.length]; apply(); }
  });
  apply();
</script>
</body>
</html>
